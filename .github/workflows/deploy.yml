name: Deploy to GitHub Pages

# main에 올라올 때와 수동 실행 시에만 배포합니다.
# (원본의 매시간 cron과 README 이미지 내보내기 단계는 제거했습니다)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'images/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # OPENROUTER_API_KEY 시크릿을 등록한 경우에만 처리 속도 정보를 갱신합니다.
      - name: Refresh OpenRouter throughput snapshot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        if: env.OPENROUTER_API_KEY != ''
        run: node web/scripts/refresh-model-performance.mjs

      - name: Build site
        working-directory: web
        env:
          # 저장소 이름 경로로 배포 (https://<user>.github.io/<repo>/)
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
