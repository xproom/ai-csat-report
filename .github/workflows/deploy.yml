name: Deploy to GitHub Pages

# main에 올라올 때와 수동 실행 시에만 배포합니다.
# 1) build: 테스트 통과 후 web/ 앱을 빌드해 web/dist를 Pages 결과물로 올림
# 2) deploy: build가 끝난 뒤 그 결과물을 배포
# 한 작업 안에서 올리자마자 배포하면 결과물을 아직 못 찾는 경우가 있어("No artifacts named github-pages")
# GitHub 공식 예시처럼 두 작업으로 나눔
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'images/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test and build
        working-directory: web
        env:
          # 저장소 이름 경로로 배포 (https://<user>.github.io/<repo>/)
          VITE_BASE: /${{ github.event.repository.name }}/
          # 중앙 서버(Supabase) 연결: 저장소 Settings → Secrets and variables → Actions → Variables에 넣으면 사이트에 연결됨 (없으면 설정 화면에서 입력)
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm test && npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
